---
# yamllint disable rule:line-length
lints:
  - atom-is-not-unique
asserts:
  - /defects[count(defect[@severity='error'])=2]
  - /defects/defect[@object='foo' and @line='4']
  - /defects/defect[normalize-space()='Atom with FQN "Ф.foo.at" is duplicated, original was found in "foo"']
foo.eo: |
  # Foo.

  [] > foo
    [] > at /A
      ? > ^
bar.eo: |
  # Bar, but its foo.

  [] > foo
    [] > at /A
      ? > ^
